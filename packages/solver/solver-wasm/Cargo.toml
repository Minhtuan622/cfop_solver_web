[package]
name = "solver-wasm"
description = "WebAssembly bindings for the CFOP solver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cube-core = { path = "../cube-core", features = ["serde"] }
cfop = { path = "../cfop" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
# wasm-opt runs separately (scripts/build-solver.mjs) so the build works
# offline and the optimizer version is pinned.
wasm-opt = false
