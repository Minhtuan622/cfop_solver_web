# cargo-deny: kiểm tra lỗ hổng (advisories) và giấy phép (licenses) của
# dependency Rust. CI chạy: cargo deny check advisories licenses

[graph]
all-features = true

[advisories]
# Mặc định: lỗ hổng và crate "unsound" làm lệnh thất bại.
# Không bỏ qua advisory nào; nếu cần bỏ qua thì ghi ID kèm lý do ở đây.
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
# Ba crate của workspace có publish = false.
ignore = true
