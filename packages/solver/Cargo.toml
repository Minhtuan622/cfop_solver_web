[workspace]
resolver = "2"
members = ["cube-core", "cfop", "solver-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Search-heavy tests (thousands of scrambles) are run optimized.
[profile.test]
opt-level = 3

# Small, fast WebAssembly for the browser.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
