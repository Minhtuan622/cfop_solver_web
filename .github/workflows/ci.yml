name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The committed lockfile is currently malformed. Remove it so pnpm
      # cannot enter headless install using the broken dependency graph.
      - name: Regenerate lockfile from package.json
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lockfile
          path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit and router tests
        run: pnpm test --run

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E tests
        run: pnpm test:e2e

      - name: Production build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
