name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Bản phát hành phải có Pyodide cục bộ: không được lặng lẽ phụ thuộc
      # CDN khi build.
      REQUIRE_LOCAL_PYODIDE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit and router tests
        run: pnpm test --run

      - name: Embed solver and verify no drift
        run: pnpm run embed-solver && git diff --exit-code client/src/lib/embeddedSolver.ts

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install chromium

      - name: Fetch the local Pyodide build
        run: pnpm fetch-pyodide

      - name: Install Chromium system packages (best effort)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # The runner image already ships every library Chromium needs (the
          # log shows "already the newest version"); this step only adds the
          # optional font packages. Ubuntu's apt mirror is occasionally
          # unreachable (DNS timeouts on azure.archive.ubuntu.com), and that
          # must not block the browser download or the e2e run.
          #
          # Each attempt is capped: a full apt run against a dead mirror
          # burns ten minutes, which would eat the whole job budget.
          for attempt in 1 2; do
            if timeout 200 pnpm exec playwright install-deps chromium; then
              echo "system packages installed"
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying"
            sleep 15
          done
          echo "::warning::optional system packages could not be installed; continuing"

      - name: Browser E2E tests
        run: pnpm test:e2e

      - name: Production build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  solver-benchmark:
    name: Solver benchmark (Pyodide)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chế độ kiểm tra của bộ đo: FAIL khi có đề giải sai, khi một đề chậm
      # hơn PER_SCRAMBLE_LIMIT_SEC (đề vượt ngưỡng được chạy lại một lần để
      # loại nhiễu), hoặc khi tổng thời gian vượt TOTAL_LIMIT_SEC.
      # Bộ đo dùng gói npm `pyodide` nên không cần tải bản phân phối cục bộ.
      - name: Run solver benchmark check
        run: node scripts/bench-solver.mjs --check --json-file bench-result.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-benchmark
          path: bench-result.json
          if-no-files-found: warn

  solver-tests:
    name: Solver tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run solver pytest suite
        working-directory: solver-python
        run: pytest tests/
