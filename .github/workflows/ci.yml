name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust solver (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/solver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solver

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solver

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Install wasm-opt (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends binaryen

      - name: Build WASM solver
        run: node scripts/build-solver.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit and router tests
        run: pnpm test --run

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install chromium

      - name: Install Chromium system packages (best effort)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # The runner image already ships every library Chromium needs (the
          # log shows "already the newest version"); this step only adds the
          # optional font packages. Ubuntu's apt mirror is occasionally
          # unreachable (DNS timeouts on azure.archive.ubuntu.com), and that
          # must not block the browser download or the e2e run.
          #
          # Each attempt is capped: a full apt run against a dead mirror
          # burns ten minutes, which would eat the whole job budget.
          for attempt in 1 2; do
            if timeout 200 pnpm exec playwright install-deps chromium; then
              echo "system packages installed"
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying"
            sleep 15
          done
          echo "::warning::optional system packages could not be installed; continuing"

      - name: Browser E2E tests
        run: pnpm test:e2e

      - name: Production build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  solver-benchmark:
    name: Solver benchmark (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solver

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Install wasm-opt (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends binaryen

      # Bộ đo đo chính bản build WebAssembly mà trình duyệt tải.
      - name: Build WASM solver
        run: node scripts/build-solver.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chế độ kiểm tra của bộ đo: FAIL khi có đề giải sai, khi một đề chậm
      # hơn PER_SCRAMBLE_LIMIT_SEC (đề vượt ngưỡng được chạy lại một lần để
      # loại nhiễu), hoặc khi tổng thời gian vượt TOTAL_LIMIT_SEC. Bộ đo chỉ
      # cần Node và module WASM, không cần cài dependency của app.
      - name: Run solver benchmark check
        run: node scripts/bench-solver.mjs --check --json-file bench-result.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-benchmark
          path: bench-result.json
          if-no-files-found: warn
