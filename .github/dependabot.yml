# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily

    open-pull-requests-limit: 10

    # Ba package dưới đây được ghim cố ý, Dependabot không được nâng:
    # - three: cubing yêu cầu ^0.170.0. Khi có hai bản three trong bundle,
    #   Object3D.intersectsFrustum bị thiếu và mô hình 3D 4×4×4 hỏng ngẫu
    #   nhiên (xem server/threeVersion.test.ts).
    # - @types/three: phải khớp với three đang chạy.
    # - pyodide: bộ đo (scripts/bench-solver.mjs) phải dùng đúng runtime mà
    #   trình duyệt nạp. Việc nâng Pyodide phải làm THỦ CÔNG, và phải sửa
    #   cùng lúc CÁ BA nơi sau đây:
    #     1. hằng số PYODIDE_VERSION trong client/src/lib/pyodideLoader.ts,
    #     2. hằng số PYODIDE_VERSION trong scripts/fetch-pyodide.mjs,
    #     3. devDependency "pyodide" trong package.json (bản đích xác, không
    #        dùng ^ hay ~).
    #   server/pyodideAssets.test.ts chặn lệch ở cả ba nơi.
    ignore:
      - dependency-name: "three"
        versions: [">=0.171.0"]
      - dependency-name: "@types/three"
        versions: [">=0.171.0"]
      # Chặn MỌI bản nâng của pyodide, không giới hạn phiên bản: trước đây
      # luật ignore chỉ chặn từ 0.28.0 trở lên nên bản vá 0.27.x lọt qua và
      # bộ đo đo một bản khác với bản đang phát hành.
      - dependency-name: "pyodide"

    groups:
      production-security:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"

      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"

      regular-updates:
        applies-to: version-updates
        patterns:
          - "*"

    labels:
      - dependencies
      - security

    commit-message:
      prefix: "security"

